name: Sync GitHub Streak Stats

on:
  schedule:
    - cron: '0 19 * * *' # Runs daily at midnight PKT (19:00 UTC)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-streak:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch Latest Streak Stats SVG
        run: |
          curl -s -f "https://streak-stats.demolab.com?user=umersmx&theme=tokyonight&hide_border=true&background=0d1117&timezone=Asia/Karachi" -o streak.svg || echo "Failed to fetch remote SVG, keeping cached version"

      - name: Commit and Push if Changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add streak.svg
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(streak): auto-sync streak stats card" && git push)
