<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 125" width="100%" height="125">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="35%" stop-color="#0f172a" />
      <stop offset="70%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#00c9ff" stop-opacity="0.9" />
    </linearGradient>

    <!-- Wave Gradient 1 -->
    <linearGradient id="wave1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00c9ff" stop-opacity="0.35" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.55" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.35" />
    </linearGradient>

    <!-- Wave Gradient 2 -->
    <linearGradient id="wave2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="50%" stop-color="#0d1117" />
      <stop offset="100%" stop-color="#0d1117" />
    </linearGradient>

    <!-- Text Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Cyber Grid Pattern -->
    <pattern id="cyberGrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="rgba(0, 201, 255, 0.08)" stroke-width="1" />
    </pattern>
  </defs>

  <style>
    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Inter', sans-serif;
      font-weight: 800;
      font-size: 36px;
      fill: #ffffff;
      letter-spacing: -0.5px;
    }
    .accent-text {
      fill: #00c9ff;
    }
    .desc-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Inter', sans-serif;
      font-weight: 500;
      font-size: 15px;
      fill: #94a3b8;
      letter-spacing: 0.5px;
    }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="125" fill="url(#bgGrad)" />

  <!-- Grid Overlay -->
  <rect width="1200" height="125" fill="url(#cyberGrid)" />

  <!-- Ambient Light Orbs -->
  <circle cx="150" cy="40" r="90" fill="#00c9ff" opacity="0.15" filter="blur(25px)" />
  <circle cx="1050" cy="50" r="110" fill="#818cf8" opacity="0.18" filter="blur(30px)" />

  <!-- Decorative Top Accent Bar -->
  <rect x="0" y="0" width="1200" height="2.5" fill="url(#wave1)" />

  <!-- Header Content -->
  <g transform="translate(600, 52)" text-anchor="middle">
    <!-- Main Name Title -->
    <text class="title-text" y="0" filter="url(#glow)">
      Muhammad Umer <tspan class="accent-text">Farooq</tspan>
    </text>

    <!-- Subtitle / Roles -->
    <text class="desc-text" y="32">
      Full-Stack Developer  •  MERN Stack  •  AI &amp; Computer Vision  •  Academic Team Lead
    </text>
  </g>

  <!-- Animated-Style Wavy Bottom Edge -->
  <path d="M 0,98 Q 300,122 600,105 T 1200,102 L 1200,125 L 0,125 Z" fill="url(#wave1)" />
  <path d="M 0,107 Q 300,128 600,113 T 1200,111 L 1200,125 L 0,125 Z" fill="url(#wave2)" />
</svg>
